<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' data: blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com;">
    
    <title>SignFlow Pro | Enterprise Orchestrator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5; 
            --surface-color: rgba(255, 255, 255, 0.85); 
            --surface-solid: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08); 
            --text-main: #1a1f36; 
            --text-muted: #6b7280;
            --accent-main: #4f46e5; 
            --accent-hover: #4338ca; 
            --danger-main: #ef4444;
            --canvas-bg: #ffffff; 
            --canvas-grid: rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #0f1115; 
            --surface-color: rgba(23, 25, 31, 0.85); 
            --surface-solid: #17191f;
            --border-color: rgba(255, 255, 255, 0.08); 
            --text-main: #f9fafb; 
            --text-muted: #9ca3af;
            --canvas-bg: #1f232b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            height: 100vh; height: 100dvh; font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color); color: var(--text-main); overflow: hidden;
        }

        .app-container { display: flex; flex-direction: column; height: 100%; position: relative; }

        .header {
            height: calc(64px + var(--safe-top));
            padding: var(--safe-top) 24px 0;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface-color); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); z-index: 100;
        }

        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }

        .toolbar {
            width: 72px; background: var(--surface-color); backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column;
            align-items: center; padding: 20px 0 calc(20px + var(--safe-bottom)); gap: 12px; z-index: 90;
        }

        .tool-btn {
            width: 48px; height: 48px; border-radius: 12px; border: none;
            background: transparent; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
            position: relative;
        }
        .tool-btn:hover { background: var(--border-color); color: var(--text-main); }
        .tool-btn.active { background: var(--accent-main); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .tool-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .canvas-viewport { 
            flex: 1; position: relative; overflow: auto; display: flex; 
            align-items: center; justify-content: center; padding: 40px;
            background: var(--bg-color);
        }
        .canvas-stack {
            position: relative; background: var(--canvas-bg); box-shadow: var(--shadow-lg);
            border-radius: 4px; overflow: hidden;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; outline: none; }
        #bgCanvas { z-index: 1; }
        #commitCanvas { z-index: 2; }
        #renderCanvas { z-index: 3; }

        .sidebar {
            position: absolute; top: 0; left: 72px; bottom: 0; width: 320px;
            background: var(--surface-solid); border-right: 1px solid var(--border-color);
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 85; display: flex; flex-direction: column;
        }
        .sidebar.active { transform: translateX(0); }

        .panel {
            position: absolute; top: 20px; right: 20px; width: 320px;
            background: var(--surface-solid); border-radius: var(--radius-lg);
            border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);
            z-index: 110; display: none; flex-direction: column;
        }
        .panel.active { display: flex; }
        .panel-header { padding: 16px; border-bottom: 1px solid var(--border-color); font-weight: 600; display: flex; justify-content: space-between; }
        .panel-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

        .btn {
            padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer;
            font-weight: 600; font-size: 14px; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent-main); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-danger { background: var(--danger-main); color: white; }

        .form-input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-main); font-size: 14px;
        }

        .toast-container {
            position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%;
            transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            background: #1a1f36; color: white; padding: 12px 24px; border-radius: 50px;
            font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: slideUp 0.3s forwards;
        }

        .replay-control {
            position: fixed; bottom: calc(30px + var(--safe-bottom)); left: 50%;
            transform: translateX(-50%); background: var(--surface-solid);
            padding: 12px 24px; border-radius: 50px; display: none;
            align-items: center; gap: 15px; box-shadow: var(--shadow-lg); z-index: 120;
        }
        .replay-control.active { display: flex; }

        .snap-line { position: absolute; background: var(--accent-main); pointer-events: none; z-index: 10; opacity: 0.5; }
        .snap-v { width: 1px; height: 100%; }
        .snap-h { height: 1px; width: 100%; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 32px; height: 32px; background: var(--accent-main); border-radius: 8px;"></div>
            <h1 style="font-size: 1.1rem; letter-spacing: -0.02em;">SignFlow <span style="font-weight: 400; opacity: 0.6;">Pro</span></h1>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" id="btnExport">Secure Export</button>
            <button class="btn btn-primary" id="btnSendUI">Secure Send</button>
            <button class="tool-btn" id="btnTheme"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg></button>
        </div>
    </header>

    <div class="workspace">
        <aside class="toolbar">
            <button class="tool-btn active" id="toolPen" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg></button>
            <button class="tool-btn" id="toolSelect" title="Select (V)"><svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8 1.4 3.3 7-1.9 0.9-3.3-7L7 21V2z"/></svg></button>
            <button class="tool-btn" id="toolEraser" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M16.24 3.56L21.19 8.51c.78.78.78 2.05 0 2.83L13.41 19.11c-.78.78-2.05.78-2.83 0L3.56 12.08c-.78-.78-.78-2.05 0-2.83L11.12 1.69c.78-.78 2.05-.78 2.83 0l2.29 1.87z"/></svg></button>
            <button class="tool-btn" id="toolText" title="Add Text"><svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg></button>
            <button class="tool-btn" id="toolDate" title="Add Date"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg></button>
            <div style="flex: 1;"></div>
            <button class="tool-btn" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
            <button class="tool-btn" id="btnReplay" title="Replay Flow"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
            <button class="tool-btn" id="btnLib" title="Library"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg></button>
        </aside>

        <section class="canvas-viewport" id="dropZone">
            <div class="canvas-stack" id="stackContainer">
                <canvas id="bgCanvas"></canvas>
                <canvas id="commitCanvas"></canvas>
                <canvas id="renderCanvas"></canvas>
                <div id="snapV" class="snap-line snap-v" style="display:none"></div>
                <div id="snapH" class="snap-line snap-h" style="display:none"></div>
            </div>
        </section>

        <aside class="sidebar" id="librarySidebar">
            <div class="panel-header">Orchestrator Library <span id="libClose" style="cursor:pointer">×</span></div>
            <div id="libList" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;"></div>
        </aside>

        <div class="panel" id="propPanel">
            <div class="panel-header">Field Properties <span id="panelClose" style="cursor:pointer">×</span></div>
            <div class="panel-body">
                <div id="textInputSection" style="display:none">
                    <label style="font-size: 12px; color: var(--text-muted);">TEXT CONTENT</label>
                    <input type="text" id="fieldTextInput" class="form-input" placeholder="Enter text...">
                </div>
                <label style="font-size: 12px; color: var(--text-muted);">STROKE / FONT COLOR</label>
                <div style="display: flex; gap: 8px;">
                    <div class="tool-btn active" style="background:#1a1f36; border:2px solid var(--accent-main)" data-color="#1a1f36"></div>
                    <div class="tool-btn" style="background:#4f46e5;" data-color="#4f46e5"></div>
                    <div class="tool-btn" style="background:#ef4444;" data-color="#ef4444"></div>
                </div>
                <label style="font-size: 12px; color: var(--text-muted);">SIZE / WIDTH</label>
                <input type="range" id="widthRange" min="1" max="50" value="3">
                <button class="btn btn-primary" id="btnSaveToLib">Store in Secure Vault</button>
                <button class="btn btn-danger" id="btnDeleteEntity" style="display:none">Delete Field</button>
            </div>
        </div>

        <div class="panel" id="emailPanel">
            <div class="panel-header">Secure Transmission <span id="emailClose" style="cursor:pointer">×</span></div>
            <div class="panel-body">
                <label style="font-size: 12px; color: var(--text-muted);">RECIPIENT EMAIL</label>
                <input type="email" id="targetEmail" class="form-input" placeholder="entity@enterprise.com">
                <p style="font-size: 11px; color: var(--text-muted);">Document will be hashed and sealed before transmission.</p>
                <button class="btn btn-primary" id="btnFinalSend">Encrypt & Send</button>
            </div>
        </div>

        <div class="replay-control" id="replayBar">
            <button class="btn" id="btnStopReplay" style="padding:8px">Stop</button>
            <div id="replayProgress" style="width:150px; height:4px; background:var(--border-color); border-radius:2px; position:relative;">
                <div id="replayFill" style="position:absolute; left:0; top:0; height:100%; background:var(--accent-main); width:0%; transition:width 0.1s linear;"></div>
            </div>
            <span id="replayLabel" style="font-size:12px; font-weight:600;">0%</span>
        </div>
    </div>

    <div class="toast-container" id="toastRoot"></div>
</div>

<script>
(function() {
    'use strict';

    // --- ENHANCED OFF-THREAD WORKER BLOB ---
    const workerCode = `
        self.onmessage = function(e) {
            const { imageData, width, height, type } = e.data;
            const canvas = new OffscreenCanvas(width, height);
            const ctx = canvas.getContext('2d');
            ctx.putImageData(imageData, 0, 0);
            
            canvas.convertToBlob({ type: 'image/png' }).then(blob => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    self.postMessage({ dataUrl: reader.result, type });
                };
                reader.readAsDataURL(blob);
            });
        };
    `;
    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const imageWorker = new Worker(URL.createObjectURL(workerBlob));

    // --- DATA FOUNDATION ---
    const Store = {
        db: null,
        async init() {
            return new Promise((resolve) => {
                const request = indexedDB.open('SignFlow_Enterprise_DB', 3);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('signatures')) db.createObjectStore('signatures');
                    if(!db.objectStoreNames.contains('documents')) db.createObjectStore('documents');
                };
                request.onsuccess = (e) => {
                    this.db = e.target.result;
                    DOMUtil.toast("Encrypted Vault Synchronized");
                    resolve(true);
                };
                request.onerror = () => resolve(false);
            });
        },
        async set(storeName, key, val) {
            const tx = this.db.transaction(storeName, 'readwrite');
            tx.objectStore(storeName).put(val, key);
        },
        async getAll(storeName) {
            return new Promise(r => {
                const req = this.db.transaction(storeName).objectStore(storeName).getAll();
                req.onsuccess = () => r(req.result);
            });
        }
    };

    // --- STATE ORCHESTRATOR ---
    const State = {
        mode: 'pen',
        isDrawing: false,
        activeStroke: [],
        entities: [],
        history: [],
        color: '#1a1f36',
        width: 3,
        pdfDoc: null,
        docHash: null,
        selectedId: null,
        isDragging: false,
        dragOffset: { x: 0, y: 0 },
        isReplaying: false,
        
        pushHistory() {
            this.history.push(JSON.stringify(this.entities));
            if(this.history.length > 50) this.history.shift();
        },
        undo() {
            if(this.history.length > 1) {
                this.history.pop();
                this.entities = JSON.parse(this.history[this.history.length - 1]);
                Render.fullRedraw();
            }
        }
    };

    // --- RENDERING CORE ---
    const Render = {
        bg: null, commit: null, draw: null,
        bgCtx: null, commitCtx: null, drawCtx: null,

        init() {
            this.bg = document.getElementById('bgCanvas');
            this.commit = document.getElementById('commitCanvas');
            this.draw = document.getElementById('renderCanvas');
            this.bgCtx = this.bg.getContext('2d', { alpha: false });
            this.commitCtx = this.commit.getContext('2d');
            this.drawCtx = this.draw.getContext('2d');
            this.resize();
        },
        resize() {
            const container = document.getElementById('stackContainer');
            const dpr = window.devicePixelRatio || 1;
            const w = container.clientWidth;
            const h = container.clientHeight;
            [this.bg, this.commit, this.draw].forEach(c => {
                c.width = w * dpr;
                c.height = h * dpr;
            });
            this.bgCtx.scale(dpr, dpr);
            this.commitCtx.scale(dpr, dpr);
            this.drawCtx.scale(dpr, dpr);
            this.fullRedraw();
        },
        fullRedraw() {
            this.commitCtx.clearRect(0, 0, this.commit.width, this.commit.height);
            // Implement SVG-style Masking for erasers
            State.entities.forEach(ent => {
                if(ent.type === 'eraser_path') {
                    this.commitCtx.globalCompositeOperation = 'destination-out';
                } else {
                    this.commitCtx.globalCompositeOperation = 'source-over';
                }
                this.drawEntity(this.commitCtx, ent);
            });
            this.commitCtx.globalCompositeOperation = 'source-over';
            this.drawSelectionUI();
        },
        drawEntity(ctx, ent) {
            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = ent.color;
            ctx.fillStyle = ent.color;
            ctx.lineWidth = ent.width;
            
            if(ent.type === 'signature' || ent.type === 'eraser_path') {
                ent.points.forEach((p, i) => {
                    if(i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
            } else if(ent.type === 'text' || ent.type === 'date') {
                ctx.font = `${ent.width * 5}px sans-serif`;
                ctx.fillText(ent.content, ent.x, ent.y);
                // Store bounding box for selection
                const metrics = ctx.measureText(ent.content);
                ent.w = metrics.width;
                ent.h = ent.width * 5;
            }
        },
        drawSelectionUI() {
            if(!State.selectedId) return;
            const ent = State.entities.find(e => e.id === State.selectedId);
            if(!ent || ent.type === 'signature') return;
            
            this.drawCtx.clearRect(0,0,this.draw.width,this.draw.height);
            this.drawCtx.setLineDash([5, 5]);
            this.drawCtx.strokeStyle = 'var(--accent-main)';
            this.drawCtx.strokeRect(ent.x - 5, ent.y - ent.h, ent.w + 10, ent.h + 10);
            this.drawCtx.setLineDash([]);
        }
    };

    // --- INPUT PIPELINE + ADAPTIVE SNAPPING ---
    const Input = {
        init() {
            const el = Render.draw;
            el.addEventListener('pointerdown', e => this.start(e));
            window.addEventListener('pointermove', e => this.move(e));
            window.addEventListener('pointerup', e => this.end(e));
        },
        getPos(e) {
            const rect = Render.draw.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        },
        start(e) {
            const pos = this.getPos(e);
            if(State.mode === 'select') {
                const target = State.entities.findLast(ent => {
                    if(ent.type === 'signature') return false;
                    return pos.x >= ent.x && pos.x <= ent.x + ent.w && pos.y >= ent.y - ent.h && pos.y <= ent.y;
                });
                if(target) {
                    State.selectedId = target.id;
                    State.isDragging = true;
                    State.dragOffset = { x: pos.x - target.x, y: pos.y - target.y };
                    document.getElementById('propPanel').classList.add('active');
                    document.getElementById('btnDeleteEntity').style.display = 'block';
                    if(target.type === 'text') {
                        document.getElementById('textInputSection').style.display = 'block';
                        document.getElementById('fieldTextInput').value = target.content;
                    }
                } else {
                    State.selectedId = null;
                    document.getElementById('propPanel').classList.remove('active');
                }
                Render.fullRedraw();
                return;
            }
            if(State.mode === 'text' || State.mode === 'date') {
                const content = State.mode === 'date' ? new Date().toLocaleDateString() : 'New Text';
                State.entities.push({
                    id: 'ent_' + Date.now(),
                    type: State.mode,
                    content,
                    x: pos.x, y: pos.y,
                    color: State.color,
                    width: State.width,
                    w: 100, h: 20
                });
                State.pushHistory();
                Render.fullRedraw();
                return;
            }
            State.isDrawing = true;
            State.activeStroke = [pos];
        },
        move(e) {
            const pos = this.getPos(e);
            
            if(State.isDragging && State.selectedId) {
                const ent = State.entities.find(e => e.id === State.selectedId);
                let newX = pos.x - State.dragOffset.x;
                let newY = pos.y - State.dragOffset.y;

                // Enterprise Smart Snapping (50px grid + center)
                const centerX = Render.draw.width / (2 * (window.devicePixelRatio||1));
                const grid = 50;
                let snappedV = false, snappedH = false;

                if(Math.abs(newX - centerX) < 10) { newX = centerX; snappedV = true; }
                else if(Math.abs(newX % grid) < 10) { newX = Math.round(newX/grid)*grid; snappedV = true; }
                
                if(Math.abs(newY % grid) < 10) { newY = Math.round(newY/grid)*grid; snappedH = true; }

                document.getElementById('snapV').style.display = snappedV ? 'block' : 'none';
                document.getElementById('snapV').style.left = newX + 'px';
                document.getElementById('snapH').style.display = snappedH ? 'block' : 'none';
                document.getElementById('snapH').style.top = newY + 'px';

                ent.x = newX; ent.y = newY;
                Render.fullRedraw();
                return;
            }

            if(!State.isDrawing) return;
            const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
            events.forEach(ev => {
                const p = this.getPos(ev);
                State.activeStroke.push(p);
                Render.drawCtx.lineTo(p.x, p.y);
                Render.drawCtx.strokeStyle = State.mode === 'eraser' ? 'white' : State.color;
                Render.drawCtx.lineWidth = State.width;
                Render.drawCtx.stroke();
            });
        },
        end() {
            document.getElementById('snapV').style.display = 'none';
            document.getElementById('snapH').style.display = 'none';
            if(State.isDragging) { State.isDragging = false; State.pushHistory(); return; }
            if(!State.isDrawing) return;
            State.isDrawing = false;
            
            if(State.activeStroke.length > 1) {
                State.entities.push({
                    id: 'sig_' + Date.now(),
                    type: State.mode === 'eraser' ? 'eraser_path' : 'signature',
                    points: [...State.activeStroke],
                    color: State.mode === 'eraser' ? '#ffffff' : State.color,
                    width: State.width
                });
                State.pushHistory();
            }
            Render.drawCtx.clearRect(0,0,Render.draw.width, Render.draw.height);
            Render.fullRedraw();
        }
    };

    // --- CRYPTOGRAPHIC SECURITY ENGINE ---
    const SecurityEngine = {
        async computeHash(data) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
    };

    // --- ENTERPRISE EXPORT ENGINE ---
    const ExportEngine = {
        async generate(isEmail = false) {
            DOMUtil.toast("Initiating Secure Flattening...");
            const { jsPDF } = window.jspdf;
            
            // Step 1: Off-Thread Image Processing
            const dpr = window.devicePixelRatio || 1;
            const commitData = Render.commitCtx.getImageData(0, 0, Render.commit.width, Render.commit.height);
            
            const sigUrl = await new Promise(resolve => {
                imageWorker.onmessage = (e) => resolve(e.data.dataUrl);
                imageWorker.postMessage({ 
                    imageData: commitData, 
                    width: Render.commit.width, 
                    height: Render.commit.height 
                });
            });

            const doc = new jsPDF({
                orientation: Render.bg.width > Render.bg.height ? 'l' : 'p',
                unit: 'px',
                format: [Render.bg.width / dpr, Render.bg.height / dpr]
            });

            // Layer 1: Background PDF
            const bgData = Render.bg.toDataURL('image/jpeg', 0.90);
            doc.addImage(bgData, 'JPEG', 0, 0, doc.internal.pageSize.getWidth(), doc.internal.pageSize.getHeight());

            // Layer 2: Secure Entities
            doc.addImage(sigUrl, 'PNG', 0, 0, doc.internal.pageSize.getWidth(), doc.internal.pageSize.getHeight());

            // Step 2: Final Integrity Seal
            const pdfOutput = doc.output('arraybuffer');
            const masterSeal = await SecurityEngine.computeHash(pdfOutput);

            // Layer 3: Legal Audit Certificate
            doc.addPage();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("LEGAL AUDIT CERTIFICATE", 40, 50);
            doc.setDrawColor(79, 70, 229);
            doc.line(40, 60, 400, 60);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            const auditData = [
                ["Document ID", State.docHash || "LOCAL_GEN_001"],
                ["Integrity Seal (SHA-256)", masterSeal],
                ["Timestamp (ISO)", new Date().toISOString()],
                ["Total Signatures", State.entities.filter(e=>e.type==='signature').length],
                ["Form Fields", State.entities.filter(e=>e.type!=='signature').length],
                ["Orchestrator Version", "SignFlow Pro v3.0.4-Enterprise"]
            ];
            
            let y = 90;
            auditData.forEach(row => {
                doc.setFont("helvetica", "bold");
                doc.text(row[0] + ":", 40, y);
                doc.setFont("helvetica", "normal");
                doc.text(row[1].toString(), 160, y);
                y += 20;
            });

            const finalPdfBlob = doc.output('blob');
            
            if(isEmail) return { blob: finalPdfBlob, hash: masterSeal };
            
            doc.save(`SignFlow_Sealed_${Date.now()}.pdf`);
            DOMUtil.toast("Document Sealed & Exported");
        },

        async sendToRecipient() {
            const email = document.getElementById('targetEmail').value;
            if(!email) return DOMUtil.toast("Recipient required");
            
            DOMUtil.toast("Encrypting Payload...");
            const { blob, hash } = await this.generate(true);
            
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                const base64data = reader.result.split(',')[1];
                
                try {
                    const response = await fetch('/.netlify/functions/send-email', {
                        method: 'POST',
                        body: JSON.stringify({
                            email: email,
                            hash: hash,
                            pdf: base64data
                        })
                    });
                    
                    if(response.ok) {
                        DOMUtil.toast("Secure Transmission Successful");
                        document.getElementById('emailPanel').classList.remove('active');
                    } else {
                        throw new Error();
                    }
                } catch (e) {
                    DOMUtil.toast("Relay Error: Using local save");
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = "UNSENT_SECURE_DOC.pdf";
                    link.click();
                }
            };
        }
    };

    // --- UI ORCHESTRATION ---
    const DocumentEngine = {
        async handleFile(file) {
            const buffer = await file.arrayBuffer();
            State.docHash = await SecurityEngine.computeHash(buffer);
            const loadingTask = pdfjsLib.getDocument({ data: buffer });
            State.pdfDoc = await loadingTask.promise;
            this.renderPage(1);
        },
        async renderPage(num) {
            const page = await State.pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 2 });
            const container = document.getElementById('stackContainer');
            container.style.width = (viewport.width / 2) + 'px';
            container.style.height = (viewport.height / 2) + 'px';
            Render.resize();
            await page.render({ canvasContext: Render.bgCtx, viewport }).promise;
        }
    };

    const DOMUtil = {
        toast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.getElementById('toastRoot').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    };

    // --- BOOTSTRAP ---
    window.addEventListener('DOMContentLoaded', async () => {
        await Store.init();
        Render.init();
        Input.init();

        const setMode = (m) => {
            State.mode = m;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const id = 'tool' + m.charAt(0).toUpperCase() + m.slice(1);
            if(document.getElementById(id)) document.getElementById(id).classList.add('active');
        };

        // UI Bindings
        document.getElementById('toolPen').onclick = () => setMode('pen');
        document.getElementById('toolSelect').onclick = () => setMode('select');
        document.getElementById('toolEraser').onclick = () => setMode('eraser');
        document.getElementById('toolText').onclick = () => setMode('text');
        document.getElementById('toolDate').onclick = () => setMode('date');
        
        document.getElementById('btnUndo').onclick = () => State.undo();
        document.getElementById('btnExport').onclick = () => ExportEngine.generate();
        document.getElementById('btnSendUI').onclick = () => document.getElementById('emailPanel').classList.add('active');
        document.getElementById('emailClose').onclick = () => document.getElementById('emailPanel').classList.remove('active');
        document.getElementById('btnFinalSend').onclick = () => ExportEngine.sendToRecipient();

        document.getElementById('fieldTextInput').oninput = (e) => {
            if(State.selectedId) {
                const ent = State.entities.find(en => en.id === State.selectedId);
                if(ent) ent.content = e.target.value;
                Render.fullRedraw();
            }
        };

        document.getElementById('btnDeleteEntity').onclick = () => {
            if(State.selectedId) {
                State.entities = State.entities.filter(e => e.id !== State.selectedId);
                State.selectedId = null;
                document.getElementById('propPanel').classList.remove('active');
                Render.fullRedraw();
                State.pushHistory();
            }
        };

        document.getElementById('btnTheme').onclick = () => {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        };

        // Drag & Drop
        const dz = document.getElementById('dropZone');
        dz.ondragover = e => e.preventDefault();
        dz.ondrop = e => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if(file && file.type === 'application/pdf') DocumentEngine.handleFile(file);
        };

        State.pushHistory();
    });

})();
</script>

</body>
</html>
